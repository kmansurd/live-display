<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live event wall</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="display-page">
  <main class="display-stage" id="display-stage">
    <div class="empty-state"><strong>Waiting for the first share.</strong><span>Scan the event QR code to add something to the wall.</span></div>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const stage = document.querySelector('#display-stage');
    const socket = io();
    const playlist = [];
    let currentIndex = 0;
    let showing = false;
    let slideTimer;
    let touchStartX = 0;

    socket.on('submission:new', (submission) => {
      addSubmission(submission);
      if (!showing) showNext();
    });

    fetch('/api/submissions').then((response) => response.json()).then(({ submissions }) => {
      submissions.forEach(addSubmission);
      if (!showing) showNext();
    });

    function addSubmission(submission) {
      if (!playlist.some((item) => item.id === submission.id)) playlist.push(submission);
    }

    function showNext() {
      if (!playlist.length) { showing = false; return; }
      clearTimeout(slideTimer);
      showing = true;
      renderCarousel();
      const submission = playlist[currentIndex];
      currentIndex = (currentIndex + 1) % playlist.length;
      const duration = submission.mediaType === 'video' ? 15000 : 8000;
      slideTimer = setTimeout(showNext, duration);
    }

    function renderCarousel() {
      const track = document.createElement('div');
      track.className = 'carousel-track';
      track.style.setProperty('--active-slide', currentIndex);

      playlist.forEach((submission, index) => {
        const slide = document.createElement('article');
        slide.className = `slide ${submission.mediaUrl ? '' : 'text-only'}${index === currentIndex ? ' active' : ''}`;
        slide.innerHTML = `${submission.mediaUrl ? `${submission.name ? `<span class="slide-name">${escapeHtml(submission.name)}</span>` : ''}<div class="slide-media">${submission.mediaType === 'video' ? `<video src="${submission.mediaUrl}" muted playsinline></video>` : `<img src="${submission.mediaUrl}" alt="Participant submission">`}</div>` : ''}<div class="slide-copy"><p>${escapeHtml(submission.message || '')}</p></div>`;
        track.append(slide);
      });

      stage.replaceChildren(track);
      const activeVideo = track.querySelector('.active video');
      if (activeVideo) activeVideo.play().catch(() => {});
    }

    function showPrevious() {
      if (!playlist.length) return;
      currentIndex = (currentIndex - 2 + playlist.length) % playlist.length;
      showNext();
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') showPrevious();
      if (event.key === 'ArrowRight' || event.key === ' ') showNext();
    });

    stage.addEventListener('pointerdown', (event) => { touchStartX = event.clientX; });
    stage.addEventListener('pointerup', (event) => {
      const distance = event.clientX - touchStartX;
      if (Math.abs(distance) < 50) return;
      if (distance > 0) showPrevious();
      else showNext();
    });

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    }
  </script>
</body>
</html>
