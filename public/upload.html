<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share to the live wall</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="upload-page">
  <main class="upload-shell">
    <p class="eyebrow">Live event wall / participant upload</p>
    <h1>Put something<br>on the big screen.</h1>
    <p class="intro">Share a thought, a photo, or a short video. Your submission will join the live loop at the venue.</p>
    <form class="form-panel" id="submission-form">
      <label class="field-label" for="message">Your message <span class="mono">optional</span></label>
      <textarea id="message" name="message" maxlength="280" placeholder="What do you want everyone to see?"></textarea>
      <div class="upload-row">
        <label class="file-label" for="media">+ Add photo or video</label>
        <input id="media" name="media" type="file" accept="image/*,video/*">
        <button class="submit-button" type="submit">Send to the wall</button>
      </div>
      <div class="file-name" id="file-name">No file selected</div>
      <p class="status" id="status" role="status"></p>
    </form>
    <p class="footer-note">Please only share content you are happy to show publicly.</p>
  </main>
  <script>
    const form = document.querySelector('#submission-form');
    const media = document.querySelector('#media');
    const fileName = document.querySelector('#file-name');
    const status = document.querySelector('#status');
    const submitButton = form.querySelector('button');

    media.addEventListener('change', () => {
      fileName.textContent = media.files[0]?.name || 'No file selected';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.className = 'status';
      status.textContent = 'Sending...';
      submitButton.disabled = true;
      try {
        const response = await fetch('/api/submissions', { method: 'POST', body: new FormData(form) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to send submission.');
        form.reset();
        fileName.textContent = 'No file selected';
        status.textContent = 'On its way to the screen.';
      } catch (error) {
        status.className = 'status error';
        status.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
